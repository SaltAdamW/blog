name: Build blog

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '*.md'
      - '*.sources.json'
      - 'source-manifest.json'
      - 'posts.json'
      - 'build.py'
      - 'requirements.txt'
      - 'admin/**'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_analytics.cjs tests/test_cms.cjs
      - run: python build.py

  update-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Rebuild tracked reading pages
        run: python build.py
      - name: Commit generated pages without overwriting newer work
        run: |
          git add -- index.html archive/index.html about/index.html feed.xml posts/*/index.html
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build: regenerate blog reading pages'
            git push origin HEAD:main
          fi
      - name: Request the existing branch-based Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds
